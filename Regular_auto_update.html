<!DOCTYPE html>
<html lang="th" class="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GCM PTA — Monthly Schedule Generator v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Fraunces:wght@300;400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --navy: #1B4F8A; --navy-light: #2563EB; --amber: #F5A623;
    --amber-light: #FCD34D; --success: #27AE60; --danger: #E74C3C;
    --bg: #F0F4F8; --surface: #FFFFFF; --surface2: #F8FAFC;
    --border: #E2E8F0; --text: #1E293B; --text2: #64748B;
    --o-color: #1B4F8A; --o-bg: #DBEAFE;
    --shadow: 0 4px 24px rgba(27,79,138,0.10);
    --shadow-lg: 0 8px 40px rgba(27,79,138,0.16);
  }
  .dark {
    --bg: #0F172A; --surface: #1E293B; --surface2: #263349;
    --border: #334155; --text: #F1F5F9; --text2: #94A3B8;
    --o-bg: #1e3a5f; --shadow: 0 4px 24px rgba(0,0,0,0.4);
    --shadow-lg: 0 8px 40px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Noto Sans Thai', sans-serif;
    transition: background 0.3s, color 0.3s;
    min-height: 100vh;
  }
  /* Cursor blink */
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  .cursor { display:inline-block; animation: blink 1s step-end infinite; }
  /* Pulse glow */
  @keyframes pulse-glow { 0%,100%{box-shadow:0 0 0 0 rgba(39,174,96,0.4)} 50%{box-shadow:0 0 0 6px rgba(39,174,96,0)} }
  .pulse-online { animation: pulse-glow 2s infinite; }
  @keyframes pulse-amber { 0%,100%{box-shadow:0 0 0 0 rgba(245,166,35,0.5)} 50%{box-shadow:0 0 0 6px rgba(245,166,35,0)} }
  .pulse-offline { animation: pulse-amber 1.5s infinite; }
  /* Slide up */
  @keyframes slideUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
  .slide-up { animation: slideUp 0.4s ease forwards; }
  /* Toast */
  @keyframes toastIn { from{opacity:0;transform:translateX(100%)} to{opacity:1;transform:translateX(0)} }
  @keyframes toastOut { from{opacity:1;transform:translateX(0)} to{opacity:0;transform:translateX(100%)} }
  .toast-enter { animation: toastIn 0.3s ease; }
  .toast-exit { animation: toastOut 0.3s ease forwards; }
  /* O badge */
  .o-badge {
    display:inline-flex; align-items:center; justify-content:center;
    width:24px; height:24px; border-radius:50%;
    background:var(--o-bg); color:var(--o-color);
    font-weight:700; font-size:11px;
    border:2px solid var(--o-color);
    transition:all 0.2s;
  }
  .o-badge:hover { transform:scale(1.2); cursor:pointer; }
  /* Table styles */
  .schedule-table { border-collapse:separate; border-spacing:0; width:100%; }
  .schedule-table th {
    background:var(--navy); color:#fff;
    padding:8px 6px; font-size:12px; font-weight:600;
    position:sticky; top:0; z-index:10;
  }
  .schedule-table td {
    padding:6px 4px; border-bottom:1px solid var(--border);
    font-size:12px; vertical-align:middle;
    background:var(--surface); transition:background 0.2s;
  }
  .schedule-table tr:hover td { background:var(--surface2); }
  .section-header td {
    background:var(--navy-light) !important;
    color:#fff; font-weight:700; font-size:12px;
    padding:6px 12px;
  }
  .dark .section-header td { background:#1e40af !important; }
  /* Day header colors */
  .day-sat { background:#FEF3C7 !important; color:#92400E !important; }
  .day-sun { background:#FEE2E2 !important; color:#991B1B !important; }
  .dark .day-sat { background:#3D2800 !important; color:#FCD34D !important; }
  .dark .day-sun { background:#3D0000 !important; color:#FCA5A5 !important; }
  /* Input styling */
  input, select {
    background:var(--surface); color:var(--text);
    border:1px solid var(--border); border-radius:8px;
    padding:8px 12px; font-family:inherit;
    transition:border 0.2s, box-shadow 0.2s;
    width:100%;
  }
  input:focus, select:focus {
    outline:none; border-color:var(--navy);
    box-shadow:0 0 0 3px rgba(27,79,138,0.15);
  }
  /* Buttons */
  .btn { padding:10px 20px; border-radius:10px; font-weight:600; cursor:pointer; border:none; font-family:inherit; font-size:14px; transition:all 0.2s; display:inline-flex; align-items:center; gap:8px; }
  .btn-primary { background:var(--navy); color:#fff; }
  .btn-primary:hover { background:var(--navy-light); transform:translateY(-1px); box-shadow:var(--shadow); }
  .btn-amber { background:var(--amber); color:#fff; }
  .btn-amber:hover { background:#e09420; transform:translateY(-1px); box-shadow:var(--shadow); }
  .btn-success { background:var(--success); color:#fff; }
  .btn-success:hover { background:#219a52; transform:translateY(-1px); box-shadow:var(--shadow); }
  .btn-ghost { background:transparent; color:var(--text2); border:1px solid var(--border); }
  .btn-ghost:hover { background:var(--surface2); }
  .btn-danger { background:var(--danger); color:#fff; }
  .btn-danger:hover { background:#c0392b; }
  /* Card */
  .card { background:var(--surface); border-radius:16px; box-shadow:var(--shadow); border:1px solid var(--border); }
  /* Modal */
  .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:100; display:flex; align-items:center; justify-content:center; padding:16px; backdrop-filter:blur(4px); }
  .modal { background:var(--surface); border-radius:20px; padding:28px; max-width:560px; width:100%; box-shadow:var(--shadow-lg); max-height:90vh; overflow-y:auto; }
  /* Scrollbar */
  ::-webkit-scrollbar { width:6px; height:6px; }
  ::-webkit-scrollbar-track { background:var(--surface2); }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
  /* Tooltip */
  [data-tip] { position:relative; }
  [data-tip]:hover::after { content:attr(data-tip); position:absolute; bottom:calc(100%+6px); left:50%; transform:translateX(-50%); background:#1E293B; color:#fff; padding:4px 10px; border-radius:6px; font-size:11px; white-space:nowrap; z-index:99; pointer-events:none; }
  /* GCM Logo */
  .gcm-logo { font-family:'Fraunces',serif; font-weight:700; color:var(--navy); }
  .gcm-logo span { color:var(--amber); }
  /* Noise texture overlay */
  body::before { content:''; position:fixed; inset:0; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E"); pointer-events:none; z-index:0; opacity:0.4; }
  .relative-z { position:relative; z-index:1; }
</style>
</head>
<body>

<!-- Toast Container -->
<div id="toastContainer" class="fixed top-4 right-4 z-50 flex flex-col gap-2" style="min-width:280px"></div>

<!-- Header -->
<header class="relative-z sticky top-0 z-40" style="background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--shadow)">
  <div class="max-w-screen-2xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="gcm-logo text-xl">GCM<span>PTA</span></div>
      <div style="width:1px;height:28px;background:var(--border)"></div>
      <div>
        <div style="font-family:'Fraunces',serif;font-weight:700;font-size:15px;color:var(--text)">Monthly Schedule Generator</div>
        <div style="font-size:11px;color:var(--text2)">CTA & PTA No.1 Plant</div>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <!-- Status -->
      <div id="statusBadge" class="flex items-center gap-2 px-3 py-1 rounded-full" style="background:var(--surface2);border:1px solid var(--border)">
        <div id="statusDot" class="w-2 h-2 rounded-full pulse-online" style="background:#27AE60"></div>
        <span id="statusText" style="font-size:12px;color:var(--text2)">Offline Ready</span>
      </div>
      <!-- Dark mode -->
      <button onclick="APP_CORE.toggleDark()" class="btn btn-ghost" style="padding:8px 12px" aria-label="Toggle dark mode">
        <svg id="iconDark" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg id="iconLight" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
      <!-- Signature -->
      <div style="font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--navy);background:var(--surface2);padding:6px 14px;border-radius:8px;border:1px solid var(--border)">
        [ Supasit.A <span class="cursor" style="color:var(--amber)">▋</span> ]
      </div>
    </div>
  </div>
</header>

<!-- Main -->
<main class="relative-z max-w-screen-2xl mx-auto px-4 py-6">

  <!-- Controls Row -->
  <div class="card p-4 mb-4 slide-up">
    <div class="flex flex-wrap items-center gap-3">
      <!-- Month Navigator -->
      <div class="flex items-center gap-2">
        <button onclick="APP_CORE.prevMonth()" class="btn btn-ghost" style="padding:8px 12px" aria-label="เดือนก่อนหน้า">◀</button>
        <div style="min-width:160px;text-align:center">
          <div style="font-family:'Fraunces',serif;font-size:18px;font-weight:700;color:var(--navy)" id="monthDisplay">February 2026</div>
          <div style="font-size:11px;color:var(--text2)" id="monthSubDisplay">28 วัน</div>
        </div>
        <button onclick="APP_CORE.nextMonth()" class="btn btn-ghost" style="padding:8px 12px" aria-label="เดือนถัดไป">▶</button>
      </div>
      <div style="flex:1;min-width:1px;height:1px"></div>
      <!-- Action Buttons -->
      <button onclick="APP_CORE.generate()" class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        Generate
      </button>
      <button onclick="APP_CORE.exportExcel()" class="btn btn-success">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export Excel
      </button>
      <button onclick="APP_CORE.printSchedule()" class="btn btn-primary" style="background:#7C3AED">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2-2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        Print / PDF
      </button>
      <button onclick="UI_RENDERER.showTaskManager()" class="btn btn-amber">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        จัดการงาน
      </button>
      <div style="width:1px;height:28px;background:var(--border)"></div>
      <button onclick="EXPORT_ENGINE.exportJSON()" class="btn btn-ghost" data-tip="ดาวน์โหลดข้อมูลเป็น JSON">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export JSON
      </button>
      <button onclick="EXPORT_ENGINE.importJSON()" class="btn btn-ghost" data-tip="นำเข้าข้อมูลจาก JSON">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Import JSON
      </button>
      <button onclick="EXPORT_ENGINE.saveStandaloneHTML()" class="btn btn-primary" style="background:#0F766E" data-tip="บันทึก HTML พร้อมข้อมูลสำหรับแชร์">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        บันทึกพร้อมข้อมูล
      </button>
    </div>
  </div>

  <!-- Stats Row -->
  <div class="grid grid-cols-2 gap-3 mb-4" style="grid-template-columns:repeat(4,1fr)">
    <div class="card p-4 slide-up" style="animation-delay:0.05s">
      <div style="font-size:11px;color:var(--text2);margin-bottom:4px">งานทั้งหมด</div>
      <div style="font-size:28px;font-weight:700;color:var(--navy)" id="statTotal">0</div>
    </div>
    <div class="card p-4 slide-up" style="animation-delay:0.1s">
      <div style="font-size:11px;color:var(--text2);margin-bottom:4px">งานรายวัน</div>
      <div style="font-size:28px;font-weight:700;color:var(--amber)" id="statDaily">0</div>
    </div>
    <div class="card p-4 slide-up" style="animation-delay:0.15s">
      <div style="font-size:11px;color:var(--text2);margin-bottom:4px">งานรายสัปดาห์</div>
      <div style="font-size:28px;font-weight:700;color:var(--navy-light)" id="statWeekly">0</div>
    </div>
    <div class="card p-4 slide-up" style="animation-delay:0.2s">
      <div style="font-size:11px;color:var(--text2);margin-bottom:4px">งานรายเดือน+</div>
      <div style="font-size:28px;font-weight:700;color:var(--success)" id="statMonthly">0</div>
    </div>
  </div>

  <!-- Schedule Table -->
  <div class="card slide-up" style="animation-delay:0.25s;overflow:hidden">
    <div style="overflow-x:auto">
      <table class="schedule-table" id="scheduleTable" aria-label="Monthly Work Schedule">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div id="emptyState" style="display:none;text-align:center;padding:60px 20px">
      <div style="font-size:48px;margin-bottom:12px">📋</div>
      <div style="font-size:16px;font-weight:600;color:var(--text2)">กด Generate เพื่อสร้างตาราง</div>
      <div style="font-size:13px;color:var(--text2);margin-top:4px">ระบบจะคำนวณวันที่อัตโนมัติจาก Last Date</div>
    </div>
  </div>

  <!-- Last saved -->
  <div style="text-align:right;margin-top:12px;font-size:11px;color:var(--text2)" id="lastSavedText"></div>
</main>

<!-- Modal Container -->
<div id="modalContainer"></div>

<script>
// ============================================================
// MODULE 1: APP_CONFIG
// ============================================================

// MODULE 2: STATE_STORE

const STATE_STORE = (() => {
  let state = {
    year: 2026, month: 1, // 0-indexed: 1 = February
    tasks: [],
    generatedSchedule: null,
    darkMode: false,
    lastSaved: null,
  };
  const subscribers = {};
  function subscribe(key, fn) {
    if (!subscribers[key]) subscribers[key] = [];
    subscribers[key].push(fn);
  }
  function emit(key) {
    (subscribers[key] || []).forEach(fn => fn(state));
  }
  function setState(patch) {
    Object.assign(state, patch);
    Object.keys(patch).forEach(k => emit(k));
    emit('*');
  }
  function getState() { return state; }
  return { subscribe, setState, getState };
})();

// MODULE 3: STORAGE_ENGINE
// ============================================================
const STORAGE_ENGINE = (() => {
  let db = null;

  function open() {
    return new Promise((res, rej) => {
      const req = indexedDB.open(APP_CONFIG.DB_NAME, APP_CONFIG.DB_VERSION);
      req.onupgradeneeded = e => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('tasks')) {
          d.createObjectStore('tasks', { keyPath: 'id' });
        }
        if (!d.objectStoreNames.contains('settings')) {
          d.createObjectStore('settings', { keyPath: 'key' });
        }
        if (!d.objectStoreNames.contains('scheduleOverrides')) {
          d.createObjectStore('scheduleOverrides', { keyPath: 'key' });
        }
      };
      req.onsuccess = e => { db = e.target.result; res(db); };
      req.onerror = () => rej(req.error);
    });
  }

  function getAll(store) {
    return new Promise((res, rej) => {
      const tx = db.transaction(store, 'readonly');
      const req = tx.objectStore(store).getAll();
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
  }

  function putAll(store, items) {
    return new Promise((res, rej) => {
      const tx = db.transaction(store, 'readwrite');
      const os = tx.objectStore(store);
      items.forEach(item => os.put(item));
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  }

  function put(store, item) {
    return putAll(store, [item]);
  }

  function del(store, key) {
    return new Promise((res, rej) => {
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).delete(key);
      tx.oncomplete = res;
      tx.onerror = () => rej(tx.error);
    });
  }

  async function saveTasks(tasks) {
    return new Promise((res, rej) => {
      const tx = db.transaction(['tasks', 'settings'], 'readwrite');
      const os = tx.objectStore('tasks');
      os.clear();
      tasks.forEach(item => os.put(item));
      tx.objectStore('settings').put({ key: 'lastSaved', value: new Date().toISOString() });
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  }

  async function saveScheduleOverrides(year, month, overrides) {
    return new Promise((res, rej) => {
      const tx = db.transaction('scheduleOverrides', 'readwrite');
      tx.objectStore('scheduleOverrides').put({ key: `${year}-${month}`, overrides });
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  }

  async function loadScheduleOverrides(year, month) {
    return new Promise((res, rej) => {
      const tx = db.transaction('scheduleOverrides', 'readonly');
      const req = tx.objectStore('scheduleOverrides').get(`${year}-${month}`);
      req.onsuccess = () => res(req.result ? req.result.overrides : {});
      req.onerror = () => rej(req.error);
    });
  }

  async function getAllOverrides() {
    const all = await getAll('scheduleOverrides');
    const map = {};
    all.forEach(item => { map[item.key] = item.overrides; });
    return map;
  }

  async function loadTasks() {
    // Check for embedded data (from "Save Standalone HTML") on first open
    if (window.__GCM_EMBEDDED__) {
      const embedded = window.__GCM_EMBEDDED__;
      window.__GCM_EMBEDDED__ = null; // consume once

      const existing = await getAll('tasks');
      if (existing.length === 0) {
        // Fresh machine — seed from embedded data
        if (embedded.tasks && embedded.tasks.length > 0) {
          await putAll('tasks', embedded.tasks);
          if (embedded.scheduleOverrides) {
            for (const [key, overrides] of Object.entries(embedded.scheduleOverrides)) {
              await new Promise((res, rej) => {
                const tx = db.transaction('scheduleOverrides', 'readwrite');
                tx.objectStore('scheduleOverrides').put({ key, overrides });
                tx.oncomplete = () => res();
                tx.onerror = () => rej(tx.error);
              });
            }
          }
          return embedded.tasks;
        }
      }
      // If IndexedDB already has data, use it (don't overwrite user's changes)
      if (existing.length > 0) return existing;
    }

    const tasks = await getAll('tasks');
    if (tasks.length === 0) {
      await putAll('tasks', APP_CONFIG.DEFAULT_TASKS);
      return APP_CONFIG.DEFAULT_TASKS;
    }
    return tasks;
  }

  async function getSettings() {
    const all = await getAll('settings');
    const map = {};
    all.forEach(s => { map[s.key] = s.value; });
    return map;
  }

  return { open, loadTasks, saveTasks, saveScheduleOverrides, loadScheduleOverrides, getAllOverrides, put, del, getSettings };
})();

// MODULE 4: FREQUENCY_CALCULATOR
// ============================================================
const FREQ_CALC = (() => {
  function getDaysInMonth(year, month) {
    return new Date(year, month + 1, 0).getDate();
  }

  function calcScheduledDays(task, year, month) {
    const daysInMonth = getDaysInMonth(year, month);
    const { freqType, freqValue, lastDate } = task;
    const last = lastDate ? new Date(lastDate) : null;
    const days = [];

    // Every day
    if (freqType === 'daily' || freqType === 'shift') {
      return Array.from({ length: daysInMonth }, (_, i) => i + 1);
    }

    // No auto-mark
    if (freqType === 'dcs' || freqType === 'batch' || freqType === 'special') {
      return [];
    }

    // Every N days → fixed multiples: N, 2N, 3N, ... within month
    if (freqType === 'days') {
      for (let d = freqValue; d <= daysInMonth; d += freqValue) {
        days.push(d);
      }
      return days;
    }

    // Every week → every occurrence of scheduleAnchor (day-of-week) in month (default: Monday=1)
    if (freqType === 'weekly') {
      const targetDow = (task.scheduleAnchor != null) ? task.scheduleAnchor : (last ? last.getDay() : 1);
      for (let d = 1; d <= daysInMonth; d++) {
        if (new Date(year, month, d).getDay() === targetDow) days.push(d);
      }
      return days;
    }

    // 2x per week → configurable two days of week (default Mon+Thu)
    if (freqType === 'biweekly') {
      const dow1 = (task.scheduleAnchor  != null) ? task.scheduleAnchor  : 1;
      const dow2 = (task.scheduleAnchor2 != null) ? task.scheduleAnchor2 : 4;
      for (let d = 1; d <= daysInMonth; d++) {
        const dow = new Date(year, month, d).getDay();
        if (dow === dow1 || dow === dow2) days.push(d);
      }
      return days;
    }

    // 1x per month → date mode or nth-weekday mode
    if (freqType === 'monthly') {
      return resolveDay(task, year, month, daysInMonth, last);
    }

    // 2x per month — date mode OR nth-weekday mode (e.g. 1st & 3rd Saturday)
    if (freqType === 'bimonthly') {
      if (task.scheduleMode === 'nthWeekday') {
        const dow  = task.scheduleAnchor     != null ? task.scheduleAnchor     : 6;
        const nth1 = task.scheduleAnchorNth  != null ? task.scheduleAnchorNth  : 1;
        const nth2 = task.scheduleAnchorNth2 != null ? task.scheduleAnchorNth2 : 3;
        const d1 = getNthWeekday(year, month, nth1, dow);
        const d2 = getNthWeekday(year, month, nth2, dow);
        if (d1) days.push(d1);
        if (d2 && d2 !== d1) days.push(d2);
        return days.sort((a, b) => a - b);
      }
      const anchor = (task.scheduleAnchor != null) ? task.scheduleAnchor : 1;
      const d1 = anchor;
      const d2 = anchor + 15;
      if (d1 >= 1 && d1 <= daysInMonth) days.push(d1);
      if (d2 >= 1 && d2 <= daysInMonth) days.push(d2);
      return days;
    }

    // 1x per 3 months → show only when current month is a due month
    if (freqType === 'quarterly') {
      if (!last) return [];
      const diff = (year - last.getFullYear()) * 12 + (month - last.getMonth());
      if (diff <= 0 || diff % 3 !== 0) return [];
      return resolveDay(task, year, month, daysInMonth, last);
    }

    // 1x per 6 months — explicit months or cycle from lastDate
    if (freqType === 'biannual') {
      const bm = task.scheduleBiannualMonths;
      if (bm) {
        if (month !== bm[0] && month !== bm[1]) return [];
      } else {
        if (!last) return [];
        const diff = (year - last.getFullYear()) * 12 + (month - last.getMonth());
        if (diff <= 0 || diff % 6 !== 0) return [];
      }
      return resolveDay(task, year, month, daysInMonth, last);
    }

    return [];
  }

  // Shared: resolve a single day for monthly/quarterly/biannual (date or nth-weekday)
  function resolveDay(task, year, month, daysInMonth, last) {
    if (task.scheduleMode === 'nthWeekday') {
      const nth = task.scheduleAnchorNth ?? 1;
      const dow = task.scheduleAnchor ?? 1;
      const d = getNthWeekday(year, month, nth, dow);
      return d ? [d] : [];
    }
    const d = (task.scheduleAnchor != null) ? task.scheduleAnchor : (last ? last.getDate() : 1);
    return [Math.min(d, daysInMonth)];
  }

  // Find the nth occurrence of a weekday (nth=0→last, nth=5→mid ~day 13-19)
  function getNthWeekday(year, month, nth, dow) {
    const dim = getDaysInMonth(year, month);
    if (nth === 5) {
      for (let d = 13; d <= 19; d++)
        if (new Date(year, month, d).getDay() === dow) return d;
      return null;
    }
    if (nth === 0) {
      for (let d = dim; d >= 1; d--)
        if (new Date(year, month, d).getDay() === dow) return d;
    } else {
      let count = 0;
      for (let d = 1; d <= dim; d++)
        if (new Date(year, month, d).getDay() === dow && ++count === nth) return d;
    }
    return null;
  }

  return { calcScheduledDays, getDaysInMonth, getNthWeekday };
})();

// UTILITY
// ============================================================
function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function renumberTasks(tasks) {
  const sections = [...new Set(tasks.map(t => t.section))];
  const result = [...tasks];
  sections.forEach(section => {
    let counter = 1;
    result.forEach(t => {
      if (t.section === section && t.no !== null) {
        t.no = counter++;
      }
    });
  });
  return result;
}

  function updateAnchorPreview(freqType) {
    const DAY_TH   = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์'];
    const NTH_TH   = {0:'สุดท้าย',1:'ที่ 1',2:'ที่ 2',3:'ที่ 3',4:'ที่ 4',5:'กลางเดือน'};
    const MONTH_EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    if (freqType === 'biannualMonths') {
      const p = document.getElementById('biannualMonthPreview');
      if (!p) return;
      const m1 = parseInt(document.getElementById('biannualMonth1')?.value) ?? 0;
      const m2 = parseInt(document.getElementById('biannualMonth2')?.value) ?? 6;
      p.textContent = `→ จะทำใน: ${MONTH_EN[m1]} · ${MONTH_EN[m2]} ทุกปี`;
      return;
    }

    const preview = document.getElementById('anchorPreview');
    if (!preview) return;

    if (freqType === 'bimonthly') {
      const modeEl = document.querySelector('input[name="schedMode"]:checked');
      const mode   = modeEl ? modeEl.value : 'date';
      if (mode === 'date') {
        const v  = parseInt(document.getElementById('scheduleAnchorInput')?.value) || 1;
        const d1 = Math.min(Math.max(v, 1), 15);
        preview.textContent = `→ ทำทุกวันที่ ${d1} และ ${d1 + 15} ของทุกเดือน`;
      } else {
        const dow  = parseInt(document.getElementById('anchorDow')?.value)   ?? 6;
        const nth1 = parseInt(document.getElementById('anchorNth')?.value)   ?? 1;
        const nth2 = parseInt(document.getElementById('anchorNth2')?.value)  ?? 3;
        preview.textContent = `→ ทำทุกวัน${DAY_TH[dow]} ${NTH_TH[nth1]||''} และ${NTH_TH[nth2]||''}`;
      }
    } else if (freqType === 'biweekly') {
      const v1 = parseInt(document.getElementById('scheduleAnchorInput')?.value)  ?? 1;
      const v2 = parseInt(document.getElementById('scheduleAnchor2Input')?.value) ?? 4;
      preview.textContent = `→ ทำทุกวัน${DAY_TH[v1]} และ${DAY_TH[v2]}`;
    } else if (freqType === 'weekly') {
      const v = parseInt(document.getElementById('scheduleAnchorInput')?.value) || 0;
      preview.textContent = `→ ทำทุกวัน${DAY_TH[v] || ''} ของทุกสัปดาห์`;
    } else {
      const modeEl = document.querySelector('input[name="schedMode"]:checked');
      const mode   = modeEl ? modeEl.value : 'date';
      if (mode === 'date') {
        const d = parseInt(document.getElementById('anchorDate')?.value) || 1;
        preview.textContent = `→ ทำทุกวันที่ ${d}`;
      } else {
        const nth = parseInt(document.getElementById('anchorNth')?.value) ?? 1;
        const dow = parseInt(document.getElementById('anchorDow')?.value) ?? 0;
        preview.textContent = `→ ทำทุกวัน${DAY_TH[dow]} สัปดาห์${NTH_TH[nth]||''}`;
      }
    }
  }

  function toggleScheduleMode(mode) {
    // monthly/quarterly/biannual sections
    const dateSection = document.getElementById('dateAnchorSection');
    const nthSection  = document.getElementById('nthWeekdaySection');
    if (dateSection) dateSection.style.display = mode === 'date' ? 'block' : 'none';
    if (nthSection)  nthSection.style.display  = mode === 'nthWeekday' ? 'flex' : 'none';
    // bimonthly sections
    const biDateSection = document.getElementById('bimonthlyDateSection');
    const biNthSection  = document.getElementById('bimonthlyNthSection');
    if (biDateSection) biDateSection.style.display = mode === 'date' ? 'block' : 'none';
    if (biNthSection)  biNthSection.style.display  = mode === 'nthWeekday' ? 'block' : 'none';
    updateAnchorPreview(biDateSection ? 'bimonthly' : null);
  }

  function updateCyclePreview(freqType) {
    const lastInput = document.getElementById('lastDateInput');
    const preview   = document.getElementById('cyclePreview');
    if (!lastInput || !preview) return;
    const MONTH_EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const val = lastInput.value;
    if (!val) { preview.textContent = '— กรุณากำหนดวันที่ทำล่าสุดก่อน'; return; }
    const sm = new Date(val).getMonth();
    const iv = freqType === 'quarterly' ? 3 : 6;
    const ms = [];
    for (let i = 0; i < 12; i += iv) ms.push(MONTH_EN[(sm + i) % 12]);
    preview.textContent = '→ จะทำใน: ' + ms.join(' · ') + ' ทุกปี';
  }

  async function saveLastDate(taskId) {
    const lastDateInput = document.getElementById('lastDateInput');
    const lastDate = lastDateInput ? (lastDateInput.value || null) : null;
    const scheduleNote = (document.getElementById('scheduleNoteInput')?.value || '').trim() || null;
    const state = STATE_STORE.getState();
    const task  = state.tasks.find(t => t.id === taskId);
    if (!task) return;
    const { freqType } = task;
    const updated = { ...task, lastDate, scheduleNote };

    if (freqType === 'weekly') {
      updated.scheduleAnchor = parseInt(document.getElementById('scheduleAnchorInput')?.value) ?? 1;
    } else if (freqType === 'biweekly') {
      updated.scheduleAnchor  = parseInt(document.getElementById('scheduleAnchorInput')?.value)  ?? 1;
      updated.scheduleAnchor2 = parseInt(document.getElementById('scheduleAnchor2Input')?.value) ?? 4;
    } else if (freqType === 'bimonthly') {
      const modeEl = document.querySelector('input[name="schedMode"]:checked');
      const mode   = modeEl ? modeEl.value : 'date';
      updated.scheduleMode = mode;
      if (mode === 'date') {
        updated.scheduleAnchor     = parseInt(document.getElementById('scheduleAnchorInput')?.value) ?? 1;
        updated.scheduleAnchorNth  = null;
        updated.scheduleAnchorNth2 = null;
      } else {
        updated.scheduleAnchor     = parseInt(document.getElementById('anchorDow')?.value)   ?? 6;
        updated.scheduleAnchorNth  = parseInt(document.getElementById('anchorNth')?.value)   ?? 1;
        updated.scheduleAnchorNth2 = parseInt(document.getElementById('anchorNth2')?.value)  ?? 3;
      }
    } else if (freqType === 'biannual') {
      const m1 = parseInt(document.getElementById('biannualMonth1')?.value) ?? 0;
      const m2 = parseInt(document.getElementById('biannualMonth2')?.value) ?? 6;
      updated.scheduleBiannualMonths = [m1, m2];
      const modeEl = document.querySelector('input[name="schedMode"]:checked');
      const mode   = modeEl ? modeEl.value : 'date';
      updated.scheduleMode = mode;
      if (mode === 'date') {
        updated.scheduleAnchor    = parseInt(document.getElementById('anchorDate')?.value) || null;
        updated.scheduleAnchorNth = null;
      } else {
        updated.scheduleAnchor    = parseInt(document.getElementById('anchorDow')?.value)  ?? 0;
        updated.scheduleAnchorNth = parseInt(document.getElementById('anchorNth')?.value)  ?? 1;
      }
    } else if (['monthly','quarterly'].includes(freqType)) {
      const modeEl = document.querySelector('input[name="schedMode"]:checked');
      const mode   = modeEl ? modeEl.value : 'date';
      updated.scheduleMode = mode;
      if (mode === 'date') {
        updated.scheduleAnchor    = parseInt(document.getElementById('anchorDate')?.value) || null;
        updated.scheduleAnchorNth = null;
      } else {
        updated.scheduleAnchor    = parseInt(document.getElementById('anchorDow')?.value)  ?? 0;
        updated.scheduleAnchorNth = parseInt(document.getElementById('anchorNth')?.value)  ?? 1;
      }
    }

    const tasks = state.tasks.map(t => t.id === taskId ? updated : t);
    STATE_STORE.setState({ tasks });
    await STORAGE_ENGINE.saveTasks(tasks);
    closeModal();
    DEBUG_MODULE.log('INFO', `Schedule updated for ${taskId}`);
    APP_CORE.generate();
    showToast('บันทึกเรียบร้อยแล้ว ✅', 'success');
  }

  async function confirmAddTask() {
    const name = document.getElementById('newName').value.trim();
    if (!name) { showToast('กรุณากรอกชื่องาน', 'error'); return; }
    let section = document.getElementById('newSection').value;
    if (section === '__new__') {
      section = (document.getElementById('newSectionName')?.value || '').trim();
      if (!section) { showToast('กรุณากรอกชื่อ Section', 'error'); return; }
    }
    const shift = document.getElementById('newShift').value.trim() || 'not fix';
    const freqType = document.getElementById('newFreqType').value;
    const freqValue = parseInt(document.getElementById('newFreqValue')?.value) || 1;
    const lastDate = document.getElementById('newLastDate').value || null;
    const scheduleNote = (document.getElementById('newScheduleNote')?.value || '').trim() || null;
    const freqLabels = { daily:'ทุกวัน', days:`1 time/${freqValue} days`, weekly:'1 time/week', biweekly:'2 time/week', monthly:'1 time/month', bimonthly:'2 time/month', quarterly:'1 time/3 months', biannual:'1 time/6 months', dcs:'Follow DCS', shift:'1 time/shift', special:'พิเศษ' };
    let scheduleAnchor = null, scheduleMode = null, scheduleAnchorNth = null;
    let scheduleAnchor2 = null, scheduleAnchorNth2 = null, scheduleBiannualMonths = null;
    if (freqType === 'biweekly') {
      scheduleAnchor  = parseInt(document.getElementById('newScheduleAnchor')?.value)  ?? 1;
      scheduleAnchor2 = parseInt(document.getElementById('newScheduleAnchor2')?.value) ?? 4;
    } else if (freqType === 'bimonthly') {
      const modeEl = document.querySelector('input[name="newBimonthlyMode"]:checked');
      scheduleMode = modeEl ? modeEl.value : 'date';
      if (scheduleMode === 'nthWeekday') {
        scheduleAnchor     = parseInt(document.getElementById('newScheduleDow')?.value)  ?? 6;
        scheduleAnchorNth  = parseInt(document.getElementById('newScheduleNth')?.value)  ?? 1;
        scheduleAnchorNth2 = parseInt(document.getElementById('newScheduleNth2')?.value) ?? 3;
      } else {
        scheduleAnchor = parseInt(document.getElementById('newScheduleAnchor')?.value) || 1;
      }
    } else if (freqType === 'biannual') {
      const m1 = parseInt(document.getElementById('newBiannualMonth1')?.value) ?? 0;
      const m2 = parseInt(document.getElementById('newBiannualMonth2')?.value) ?? 6;
      scheduleBiannualMonths = [m1, m2];
      const modeEl = document.querySelector('input[name="newSchedMode"]:checked');
      scheduleMode = modeEl ? modeEl.value : 'date';
      if (scheduleMode === 'nthWeekday') {
        scheduleAnchor    = parseInt(document.getElementById('newScheduleDow')?.value) ?? 0;
        scheduleAnchorNth = parseInt(document.getElementById('newScheduleNth')?.value) ?? 1;
      } else {
        scheduleAnchor = parseInt(document.getElementById('newScheduleAnchor')?.value) || null;
      }
    } else if (['monthly','quarterly'].includes(freqType)) {
      const modeEl = document.querySelector('input[name="newSchedMode"]:checked');
      scheduleMode = modeEl ? modeEl.value : 'date';
      if (scheduleMode === 'nthWeekday') {
        scheduleAnchor    = parseInt(document.getElementById('newScheduleDow')?.value) ?? 0;
        scheduleAnchorNth = parseInt(document.getElementById('newScheduleNth')?.value) ?? 1;
      } else {
        scheduleAnchor = parseInt(document.getElementById('newScheduleAnchor')?.value) || null;
      }
    } else {
      scheduleAnchor = parseInt(document.getElementById('newScheduleAnchor')?.value) ?? null;
    }
    const noVal = parseInt(document.getElementById('newNo')?.value);
    const newTask = {
      id: 't' + Date.now(),
      no: isNaN(noVal) ? null : noVal, section, name, shift,
      freqType, freqValue,
      freqLabel: freqLabels[freqType] || freqType,
      lastDate, scheduleAnchor, scheduleMode, scheduleAnchorNth,
      scheduleAnchor2, scheduleAnchorNth2, scheduleBiannualMonths, scheduleNote
    };
    const state = STATE_STORE.getState();
    let tasks = [...state.tasks, newTask];
    tasks = renumberTasks(tasks);
    STATE_STORE.setState({ tasks });
    await STORAGE_ENGINE.saveTasks(tasks);
    closeModal();
    showToast('เพิ่มงานสำเร็จ ✅', 'success');
    APP_CORE.generate();
  }

  async function deleteTask(taskId) {
    if (!confirm('ยืนยันลบรายการงานนี้?')) return;
    const state = STATE_STORE.getState();
    let tasks = state.tasks.filter(t => t.id !== taskId);
    tasks = renumberTasks(tasks);
    STATE_STORE.setState({ tasks });
    await STORAGE_ENGINE.saveTasks(tasks);
    closeModal();
    APP_CORE.generate();
    showToast('ลบงานเรียบร้อยแล้ว', 'success');
  }

  function closeModal() {
    document.getElementById('modalContainer').innerHTML = '';
  }

  function showToast(msg, type = 'info') {
    const colors = { success: '#27AE60', error: '#E74C3C', info: '#1B4F8A', warning: '#F5A623' };
    const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
    const el = document.createElement('div');
    el.className = 'toast-enter';
    el.style.cssText = `background:${colors[type]};color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,0.2);display:flex;align-items:center;gap:8px`;
    const icon = document.createElement('span');
    icon.textContent = icons[type];
    const text = document.createElement('span');
    text.textContent = msg; // safe: textContent
    el.appendChild(icon);
    el.appendChild(text);
    document.getElementById('toastContainer').appendChild(el);
    setTimeout(() => {
      el.className = 'toast-exit';
      setTimeout(() => el.remove(), 300);
    }, 3000);
  }

  function updateStats(tasks, schedule) {
    document.getElementById('statTotal').textContent = tasks.length;
    let daily = 0, weekly = 0, monthly = 0;
    const monthlyTypes = new Set(['monthly','bimonthly','days','every_n','quarterly']);
    tasks.forEach(t => {
      if (t.freqType === 'daily' || t.freqType === 'shift') daily++;
      else if (t.freqType === 'weekly' || t.freqType === 'biweekly') weekly++;
      else if (monthlyTypes.has(t.freqType)) monthly++;
      // dcs, batch, special, biannual — not auto-scheduled, excluded from counts
    });
    document.getElementById('statDaily').textContent = daily;
    document.getElementById('statWeekly').textContent = weekly;
    document.getElementById('statMonthly').textContent = monthly;
  }

  return {
    renderHeader, renderBody, toggleDay,
    editLastDate, saveLastDate, updateAnchorPreview, toggleScheduleMode, updateCyclePreview,
    showTaskManager, showAddTask, showAddTaskInSection, updateFreqUI, updateAddAnchorPreview, toggleNewSectionInput,
    confirmAddTask, deleteTask,
    closeModal, showToast, updateStats
  };
})();

const DEBUG_MODULE = (() => {
  const logs = [];
  function log(level, msg, data = null) {
    const entry = { ts: new Date().toISOString(), level, msg, data };
    logs.push(entry);
    if (level === 'ERROR') console.error(`[GCM] ${msg}`, data);
    else console.log(`[GCM][${level}] ${msg}`, data || '');
  }
  function getLogs() { return [...logs]; }
  return { log, getLogs };
})();

// MODULE 7: EXPORT ENGINE
// ============================================================
const EXPORT_ENGINE = (() => {

  function exportExcel(tasks, schedule, year, month) {
    const monthName = APP_CONFIG.MONTH_EN[month];
    const days = FREQ_CALC.getDaysInMonth(year, month);
    const wb = XLSX.utils.book_new();

    // ---- Build worksheet data ----
    const wsData = [];

    // Row 1: blank
    wsData.push([]);

    // Row 2: Title
    const titleRow = new Array(days + 7).fill('');
    titleRow[1] = `MONTHLY REGULAR WORK  SCHEDULE FOR CTA & PTA No.1 PLANT`;
    titleRow[days + 3] = 'Prepared by : Supasit A.';
    titleRow[days + 5] = 'Rev :0';
    wsData.push(titleRow);

    // Row 3: Approved
    const approvedRow = new Array(days + 7).fill('');
    approvedRow[days + 3] = 'Approved by :';
    approvedRow[days + 5] = `${year}-${String(month + 1).padStart(2, '0')}-01`;
    wsData.push(approvedRow);

    // Row 4: CC
    const ccRow = new Array(days + 7).fill('');
    ccRow[0] = 'CC :  CTA F/M, PTA F/M';
    wsData.push(ccRow);

    // Row 5: Column headers
    const hdr1 = ['No.', 'TA Unit work', 'Time / Shift', 'Frequency'];
    for (let d = 1; d <= days; d++) hdr1.push(d);
    wsData.push(hdr1);

    // Row 6: Day names
    const hdr2 = ['', '', '', ''];
    for (let d = 1; d <= days; d++) {
      hdr2.push(APP_CONFIG.DAY_EN[new Date(year, month, d).getDay()]);
    }
    wsData.push(hdr2);

    // Data rows by section
    const sections = [...new Set(tasks.map(t => t.section))];
    const merges = [];
    const dateStartCol = 4; // No.(0) name(1) shift(2) freq(3) day1(4)
    sections.forEach(section => {
      // Section header row
      const secRow = new Array(days + 4).fill('');
      secRow[1] = section;
      wsData.push(secRow);

      tasks.filter(t => t.section === section).forEach(task => {
        const sched = schedule[task.id] || [];
        const row = [
          task.no || '',
          task.name,
          task.shift,
          task.freqLabel,
        ];
        if (task.scheduleNote) {
          row.push(task.scheduleNote);
          for (let d = 1; d < days; d++) row.push('');
          const rowIdx = wsData.length;
          merges.push({ s: { r: rowIdx, c: dateStartCol }, e: { r: rowIdx, c: dateStartCol + days - 1 } });
        } else {
          for (let d = 1; d <= days; d++) {
            row.push(sched.includes(d) ? 'O' : '');
          }
        }
        wsData.push(row);
      });
    });

    // Note row
    const noteRow = new Array(days + 4).fill('');
    noteRow[1] = 'Note  :  ให้ทำเครื่องหมาย O เมื่อได้ปฏิบัติงานเสร็จแล้ว และส่งให้ ผจผ.ผลิต รับทราบภายในวันที่ 1 ของเดือนถัดไป';
    noteRow[days + 2] = 'PE-F-0026-05';
    wsData.push([]);
    wsData.push(noteRow);

    const ws = XLSX.utils.aoa_to_sheet(wsData);

    // Apply merges for scheduleNote rows
    if (merges.length > 0) {
      ws['!merges'] = (ws['!merges'] || []).concat(merges);
    }

    // Column widths
    const cols = [{ wch: 5 }, { wch: 50 }, { wch: 12 }, { wch: 20 }];
    for (let d = 0; d < days; d++) cols.push({ wch: 5 });
    ws['!cols'] = cols;

    XLSX.utils.book_append_sheet(wb, ws, 'PE#1');

    const filename = `CTA1_PTA1_Monthly_Regular_${monthName}_${year}.xlsx`;
    XLSX.writeFile(wb, filename);
    DEBUG_MODULE.log('INFO', `Exported: ${filename}`);
    return filename;
  }

  async function exportJSON() {
    const state = STATE_STORE.getState();
    const tasks = state.tasks;
    const allOverrides = await STORAGE_ENGINE.getAllOverrides();
    const data = {
      version: 1,
      exportedAt: new Date().toISOString(),
      tasks,
      scheduleOverrides: allOverrides
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `GCM_Schedule_backup_${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    UI_RENDERER.showToast('Export JSON สำเร็จ ✅', 'success');
  }

  function importJSON() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        if (!data.tasks || !Array.isArray(data.tasks)) {
          UI_RENDERER.showToast('ไฟล์ไม่ถูกต้อง: ไม่พบ tasks', 'error');
          return;
        }
        await STORAGE_ENGINE.saveTasks(data.tasks);
        STATE_STORE.setState({ tasks: data.tasks });
        if (data.scheduleOverrides && typeof data.scheduleOverrides === 'object') {
          for (const [key, overrides] of Object.entries(data.scheduleOverrides)) {
            const parts = key.split('-');
            const year = parseInt(parts[0]);
            const month = parseInt(parts[1]);
            await STORAGE_ENGINE.saveScheduleOverrides(year, month, overrides);
          }
        }
        await APP_CORE.generate();
        UI_RENDERER.showToast(`นำเข้าข้อมูลสำเร็จ ✅ (${data.tasks.length} รายการ)`, 'success');
      } catch (err) {
        DEBUG_MODULE.log('ERROR', 'Import JSON failed', err);
        UI_RENDERER.showToast('นำเข้าไม่สำเร็จ: ' + err.message, 'error');
      }
    };
    document.body.appendChild(input);
    input.click();
    document.body.removeChild(input);
  }

  async function saveStandaloneHTML() {
    try {
      const state = STATE_STORE.getState();
      const tasks = state.tasks;
      const allOverrides = await STORAGE_ENGINE.getAllOverrides();

      const embeddedData = { tasks, scheduleOverrides: allOverrides };

      // Get current page HTML
      let html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

      // Remove any previously injected embedded-data script
      html = html.replace(/<script id="gcm-embedded-data">[\s\S]*?<\/script>\s*/g, '');

      // Inject new embedded data script just before </head>
      const dataScript = `<script id="gcm-embedded-data">window.__GCM_EMBEDDED__=${JSON.stringify(embeddedData)};<\/script>\n`;
      html = html.replace('</head>', dataScript + '</head>');

      const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const monthName = APP_CONFIG.MONTH_EN[state.month];
      a.download = `GCM_Schedule_${monthName}_${state.year}.html`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      UI_RENDERER.showToast('บันทึก HTML พร้อมข้อมูลสำเร็จ ✅', 'success');
    } catch (err) {
      DEBUG_MODULE.log('ERROR', 'Save standalone HTML failed', err);
      UI_RENDERER.showToast('บันทึกไม่สำเร็จ: ' + err.message, 'error');
    }
  }

  return { exportExcel, exportJSON, importJSON, saveStandaloneHTML };
})();

// MODULE 8: APP_CORE
// ============================================================
const APP_CORE = (() => {

  function updateMonthDisplay() {
    const { year, month } = STATE_STORE.getState();
    const days = FREQ_CALC.getDaysInMonth(year, month);
    document.getElementById('monthDisplay').textContent = `${APP_CONFIG.MONTH_EN[month]} ${year}`;
    document.getElementById('monthSubDisplay').textContent = `${days} วัน`;
  }

  function prevMonth() {
    const { year, month } = STATE_STORE.getState();
    if (month === 0) STATE_STORE.setState({ year: year - 1, month: 11 });
    else STATE_STORE.setState({ month: month - 1 });
    updateMonthDisplay();
  }

  function nextMonth() {
    const { year, month } = STATE_STORE.getState();
    if (month === 11) STATE_STORE.setState({ year: year + 1, month: 0 });
    else STATE_STORE.setState({ month: month + 1 });
    updateMonthDisplay();
  }

  async function generate() {
    const state = STATE_STORE.getState();
    const { year, month, tasks } = state;
    const days = FREQ_CALC.getDaysInMonth(year, month);

    // Calculate base schedule for each task
    const baseSchedule = {};
    tasks.forEach(task => {
      baseSchedule[task.id] = FREQ_CALC.calcScheduledDays(task, year, month);
    });

    // Load and apply overrides
    let overrides = {};
    try {
      overrides = await STORAGE_ENGINE.loadScheduleOverrides(year, month);
    } catch(e) {
      DEBUG_MODULE.log('WARN', 'Could not load overrides', e);
    }

    // Merge: use override if it exists for a task
    const schedule = { ...baseSchedule };
    Object.keys(overrides).forEach(taskId => {
      if (schedule.hasOwnProperty(taskId)) {
        schedule[taskId] = overrides[taskId];
      }
    });

    STATE_STORE.setState({ generatedSchedule: schedule });

    // Render
    UI_RENDERER.renderHeader(year, month, days);
    UI_RENDERER.renderBody(tasks, schedule, year, month, days);
    UI_RENDERER.updateStats(tasks, schedule);

    document.getElementById('scheduleTable').style.display = '';
    document.getElementById('emptyState').style.display = 'none';

    // Update last saved
    const now = new Date().toLocaleString('th-TH');
    document.getElementById('lastSavedText').textContent = `Generated: ${now}`;

    DEBUG_MODULE.log('INFO', `Schedule generated for ${APP_CONFIG.MONTH_EN[month]} ${year}`, { taskCount: tasks.length });
  }

  function printSchedule() {
    const state = STATE_STORE.getState();
    if (!state.generatedSchedule) {
      UI_RENDERER.showToast('กรุณากด Generate ก่อน Print', 'warning');
      return;
    }

    const { tasks, generatedSchedule: schedule, year, month } = state;
    const days = FREQ_CALC.getDaysInMonth(year, month);
    const monthName = APP_CONFIG.MONTH_EN[month];
    const sections = [...new Set(tasks.map(t => t.section))];

    // ── Day header rows ─────────────────────────────────────
    const dayNumCols = Array.from({ length: days }, (_, i) => {
      const dow = new Date(year, month, i + 1).getDay();
      const cls = dow === 0 ? 'sun' : dow === 6 ? 'sat' : '';
      return `<th class="dc ${cls}">${i + 1}</th>`;
    }).join('');

    const dayNameCols = Array.from({ length: days }, (_, i) => {
      const dow = new Date(year, month, i + 1).getDay();
      const cls = dow === 0 ? 'sun' : dow === 6 ? 'sat' : '';
      return `<th class="dc ${cls}">${APP_CONFIG.DAY_EN[dow]}</th>`;
    }).join('');

    // ── Data rows ────────────────────────────────────────────
    let bodyRows = '';
    sections.forEach(section => {
      bodyRows += `<tr><td colspan="${4 + days}" class="sec-hdr">${section}</td></tr>`;
      tasks.filter(t => t.section === section).forEach(task => {
        const sched = schedule[task.id] || [];
        const dayCells = task.scheduleNote
          ? `<td colspan="${days}" class="sched-note">${escapeHtml(task.scheduleNote)}</td>`
          : Array.from({ length: days }, (_, i) => {
              const d = i + 1;
              const dow = new Date(year, month, d).getDay();
              const cls = dow === 0 ? 'sun' : dow === 6 ? 'sat' : '';
              return `<td class="dc ${cls}">${sched.includes(d) ? 'O' : ''}</td>`;
            }).join('');
        bodyRows += `<tr>
          <td class="nc">${task.no || ''}</td>
          <td class="nm">${escapeHtml(task.name)}</td>
          <td class="sh">${escapeHtml(task.shift)}</td>
          <td class="fq">${escapeHtml(task.freqLabel)}</td>
          ${dayCells}
        </tr>`;
      });
    });

    // ── Column width calc ────────────────────────────────────
    // A3 portrait usable ≈ 285mm (6mm margins). Fixed cols: No.9 + Shift18 + Freq38 = 65mm
    // Day cols: days × 4.5mm. Name: remainder.
    const dayW = 4.5; // mm per day column
    const fixedW = 65;
    const nameW = Math.max(40, 285 - fixedW - (days * dayW));
    const colgroup = `
      <colgroup>
        <col style="width:9mm">
        <col style="width:${nameW}mm">
        <col style="width:18mm">
        <col style="width:38mm">
        ${Array.from({ length: days }, () => `<col style="width:${dayW}mm">`).join('')}
      </colgroup>`;

    const html = `<!DOCTYPE html>

    }
    try {
      const filename = EXPORT_ENGINE.exportExcel(tasks, generatedSchedule, year, month);
      UI_RENDERER.showToast(`ดาวน์โหลด ${filename} สำเร็จ ✅`, 'success');
    } catch (e) {
      DEBUG_MODULE.log('ERROR', 'Export failed', e);
      UI_RENDERER.showToast('Export ล้มเหลว: ' + e.message, 'error');
    }
  }

  function toggleDark() {
    const html = document.documentElement;
    const isDark = html.classList.toggle('dark');
    STATE_STORE.setState({ darkMode: isDark });
    document.getElementById('iconDark').style.display = isDark ? 'none' : '';
    document.getElementById('iconLight').style.display = isDark ? '' : 'none';
    localStorage.setItem('gcm_dark', isDark ? '1' : '0');
  }

  async function init() {
    try {
      // Restore dark mode
      if (localStorage.getItem('gcm_dark') === '1') toggleDark();

      // Open IndexedDB
      await STORAGE_ENGINE.open();
      DEBUG_MODULE.log('INFO', 'IndexedDB opened');

      // Load tasks
      const tasks = await STORAGE_ENGINE.loadTasks();
      STATE_STORE.setState({ tasks });
      DEBUG_MODULE.log('INFO', `Loaded ${tasks.length} tasks`);

      // Load settings
      const settings = await STORAGE_ENGINE.getSettings();
      if (settings.lastSaved) {
        const d = new Date(settings.lastSaved).toLocaleString('th-TH');
        document.getElementById('lastSavedText').textContent = `บันทึกล่าสุด: ${d}`;
      }

      // Update display
      updateMonthDisplay();

      // Show empty state initially
      document.getElementById('emptyState').style.display = 'block';
      document.getElementById('scheduleTable').style.display = 'none';

      // Stats initial
      UI_RENDERER.updateStats(tasks, {});

      // Offline indicator
      document.getElementById('statusText').textContent = 'Offline Ready';

      // Auto-generate for current month
      await generate();

    } catch (e) {
      DEBUG_MODULE.log('ERROR', 'Init failed', e);
      UI_RENDERER.showToast('เกิดข้อผิดพลาดในการเริ่มต้นระบบ: ' + e.message, 'error');
    }
  }

  return { init, prevMonth, nextMonth, generate, exportExcel, printSchedule, toggleDark };
})();

// ============================================================
// BOOT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  APP_CORE.init();
});
</script>
</body>
</html>
